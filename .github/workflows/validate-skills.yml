name: validate-skills

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-skills:
    name: validate-skills
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Download pinned Codex validator
        env:
          VALIDATOR_URL: https://raw.githubusercontent.com/openai/codex/5e32f728f1f86a967c6be057351f12505778df8f/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py
          VALIDATOR_SHA256: 1fd66498c219616fd9249eacdf16c458412ea9065a9d887fd716aeef03907762
        run: |
          curl --fail --silent --show-error --location "$VALIDATOR_URL" --output "$RUNNER_TEMP/quick_validate.py"
          printf '%s  %s\n' "$VALIDATOR_SHA256" "$RUNNER_TEMP/quick_validate.py" | sha256sum --check --strict

      - name: Validate every skill
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          skill_files=(skills/*/SKILL.md .agents/skills/*/SKILL.md)
          if ((${#skill_files[@]} == 0)); then
            echo '::error::No skill entrypoints found'
            exit 1
          fi
          for skill_file in "${skill_files[@]}"; do
            skill_dir=${skill_file%/SKILL.md}
            printf '%s: ' "$skill_dir"
            python "$RUNNER_TEMP/quick_validate.py" "$skill_dir"
          done

          metadata_files=(
            skills/*/agents/openai.yaml
            .agents/skills/*/agents/openai.yaml
          )
          python - "${skill_files[@]}" -- "${metadata_files[@]}" <<'PY'
          import pathlib
          import re
          import sys

          import yaml

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              loader.flatten_mapping(node)
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise ValueError(f"duplicate key: {key}")
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )

          def require_mapping(value, location):
              if not isinstance(value, dict):
                  raise ValueError(f"{location} must be a mapping")

          def reject_unknown(value, allowed, location):
              unknown = set(value) - set(allowed)
              if unknown:
                  raise ValueError(
                      f"{location} has unsupported keys: "
                      f"{', '.join(sorted(map(str, unknown)))}"
                  )

          def load_mapping(text, location):
              data = yaml.load(text, Loader=UniqueKeyLoader)
              require_mapping(data, location)
              return data

          arguments = sys.argv[1:]
          separator = arguments.index("--")
          skill_files = [pathlib.Path(value) for value in arguments[:separator]]
          metadata_files = [
              pathlib.Path(value) for value in arguments[separator + 1 :]
          ]

          for skill_file in skill_files:
              try:
                  content = skill_file.read_text()
                  match = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
                  if match is None:
                      raise ValueError("invalid frontmatter format")
                  frontmatter = load_mapping(match.group(1), str(skill_file))
                  name = frontmatter.get("name")
                  if not isinstance(name, str) or not name.strip():
                      raise ValueError("frontmatter.name must be a non-empty string")
                  if name.strip() != skill_file.parent.name:
                      raise ValueError(
                          "frontmatter.name must match its skill directory"
                      )
                  description = frontmatter.get("description")
                  if not isinstance(description, str) or not description.strip():
                      raise ValueError(
                          "frontmatter.description must be a non-empty string"
                      )
              except (OSError, TypeError, ValueError, yaml.YAMLError) as error:
                  print(f"::error file={skill_file}::{error}")
                  raise SystemExit(1)

              print(f"{skill_file}: required frontmatter valid")

          for path in metadata_files:
              try:
                  data = load_mapping(path.read_text(), str(path))
                  if not data:
                      raise ValueError("metadata must contain a supported section")
                  reject_unknown(
                      data,
                      {"interface", "dependencies", "policy"},
                      str(path),
                  )
                  skill_name = path.parents[1].name

                  if "interface" in data:
                      interface = data["interface"]
                      require_mapping(interface, "interface")
                      reject_unknown(
                          interface,
                          {
                              "display_name",
                              "short_description",
                              "icon_small",
                              "icon_large",
                              "brand_color",
                              "default_prompt",
                          },
                          "interface",
                      )
                      for key, value in interface.items():
                          if not isinstance(value, str) or not value.strip():
                              raise ValueError(
                                  f"interface.{key} must be a non-empty string"
                              )
                      description = interface.get("short_description")
                      if description is not None and not 25 <= len(description) <= 64:
                          raise ValueError(
                              "interface.short_description must be 25-64 characters"
                          )
                      color = interface.get("brand_color")
                      if color is not None and not re.fullmatch(
                          r"#[0-9A-Fa-f]{6}", color
                      ):
                          raise ValueError(
                              "interface.brand_color must be a six-digit hex color"
                          )
                      prompt = interface.get("default_prompt")
                      tokens = set(re.findall(r"\$[a-z0-9-]+", prompt or ""))
                      if prompt is not None and f"${skill_name}" not in tokens:
                          raise ValueError(
                              "interface.default_prompt must mention the complete "
                              f"${skill_name} token"
                          )
                      skill_root = path.parents[1].resolve()
                      for icon_key in ("icon_small", "icon_large"):
                          icon = interface.get(icon_key)
                          if icon is None:
                              continue
                          icon_path = pathlib.Path(icon)
                          if icon_path.is_absolute():
                              raise ValueError(
                                  f"interface.{icon_key} must be relative to the skill"
                              )
                          target = (skill_root / icon_path).resolve()
                          if skill_root not in target.parents or not target.is_file():
                              raise ValueError(
                                  f"interface.{icon_key} must reference a skill file"
                              )

                  if "dependencies" in data:
                      dependencies = data["dependencies"]
                      require_mapping(dependencies, "dependencies")
                      reject_unknown(dependencies, {"tools"}, "dependencies")
                      tools = dependencies.get("tools")
                      if not isinstance(tools, list) or not tools:
                          raise ValueError(
                              "dependencies.tools must be a non-empty list"
                          )
                      for index, tool in enumerate(tools):
                          location = f"dependencies.tools[{index}]"
                          require_mapping(tool, location)
                          reject_unknown(
                              tool,
                              {
                                  "type",
                                  "value",
                                  "description",
                                  "transport",
                                  "url",
                              },
                              location,
                          )
                          if tool.get("type") != "mcp":
                              raise ValueError(f"{location}.type must be mcp")
                          identifier = tool.get("value")
                          if not isinstance(identifier, str) or not identifier.strip():
                              raise ValueError(
                                  f"{location}.value must be a non-empty MCP identifier"
                              )
                          for key, value in tool.items():
                              if not isinstance(value, str) or not value.strip():
                                  raise ValueError(
                                      f"{location}.{key} must be a non-empty string"
                                  )

                  if "policy" in data:
                      policy = data["policy"]
                      require_mapping(policy, "policy")
                      reject_unknown(
                          policy,
                          {"allow_implicit_invocation"},
                          "policy",
                      )
                      implicit = policy.get("allow_implicit_invocation")
                      if not isinstance(implicit, bool):
                          raise ValueError(
                              "policy.allow_implicit_invocation must be a boolean"
                          )
              except (OSError, TypeError, ValueError, yaml.YAMLError) as error:
                  print(f"::error file={path}::{error}")
                  raise SystemExit(1)

              print(f"{path}: metadata valid")
          PY
